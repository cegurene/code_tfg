env:
  algorithm: PPO
  num_cpu: 1
  use_delayed_sensors: true
  env_name: nair_walk_h0918KneeExoRS2-v0
  torch_dir: null
checkpoint:
  resume_from: null
collector:
  frames_per_batch: 4096
  total_frames: 10000000
  learning_epochs: 10
  buffer_size: 4096
logger:
  exp_name: nair_walk_h0918_exo_knee_Espasticity_PPO
  write_interval: 100000
  test_interval: 100000
  check_interval: 100000
  num_test_episodes: 5
optim:
  lr: 0.0003
  optimizer: KLAdaptiveRL
  optimizer_kwargs:
    kl_threshold: 0.008
  weight_decay: 0.0
  anneal_lr: true
hiperparameters:
  clip_epsilon: 0.2
  entropy_coef: 0.001
  critic_coef: 1.0
  lmbda: 0.95
  gamma: 0.99
  batch_size: 1024
  mini_batch_size: 256
  max_grad_norm: 0.5
